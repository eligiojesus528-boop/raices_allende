{% extends "admin/base_site.html" %}

{% block extrastyle %}
<style>
body.login {
    background: linear-gradient(135deg, #0f1f15 0%, #23472d 100%);
    font-family: Verdana, Arial, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
}

.login #header {
    background: transparent;
    border: none;
    text-align: center;
}

.login #branding h1 {
    color: white;
    font-family: Georgia, serif;
    font-size: 26px;
    margin: 0;
}

.login .form-row {
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    padding: 30px 25px;
    width: 360px;
    max-width: 90%;
}

.login .form-row label {
    color: #23472d;
    font-weight: bold;
    font-size: 14px;
}

.login input[type="text"],
.login input[type="password"] {
    border: 2px solid #8eb897;
    border-radius: 6px;
    padding: 10px;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
}

.login input:focus {
    outline: none;
    border-color: #23472d;
}

.login .submit-row {
    text-align: center;
    padding: 20px 0 0 0;
}

.login .submit-row input {
    background: #23472d;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 30px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s ease;
}

.login .submit-row input:hover {
    background: #346641;
}

.login .password-reset-link {
    text-align: center;
    margin-top: 15px;
}

.login a:link, .login a:visited {
    color: #23472d;
}
</style>
{% endblock %}

{% block branding %}
<h1>🌿 Raíces Allende — Administración</h1>
{% endblock %}
